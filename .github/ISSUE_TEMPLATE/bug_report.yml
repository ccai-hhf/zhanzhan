name: 问题反馈 / Bug report
description: 报告沾沾的问题（请勿上传真实剪贴板内容）
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 沾沾版本
      placeholder: 0.3.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS 版本、芯片和触控板型号
      placeholder: macOS 26.5 / M2 / 内置触控板
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期和实际结果
      description: 请用示例文字复现，不要上传 History.json、Favorites.json 或真实剪贴板内容。
    validations:
      required: true
